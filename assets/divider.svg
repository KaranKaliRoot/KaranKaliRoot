<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="44" viewBox="0 0 1000 44" role="img"><title>divider</title>
<defs>
<linearGradient id="pg" x1="0" y1="1" x2="0" y2="0">
  <stop offset="0" stop-color="#f58fab"/><stop offset="0.55" stop-color="#ffc3d3"/><stop offset="1" stop-color="#fff1f5"/>
