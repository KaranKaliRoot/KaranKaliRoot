<linearGradient id="l1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d8b36a" stop-opacity="0"/><stop offset="1" stop-color="#d8b36a"/></linearGradient><linearGradient id="l2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d8b36a"/><stop offset="1" stop-color="#d8b36a" stop-opacity="0"/></linearGradient></defs>
