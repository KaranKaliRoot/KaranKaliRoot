# OPTIONAL: copy into any other repo at .github/workflows/trigger-profile-update.yml
# Needs a repo secret PROFILE_PAT (fine-grained token, access to your profile repo, Contents: read/write)
name: Ping profile README

on:
  push:
    branches: [main]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.PROFILE_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/KaranKaliRoot/KaranKaliRoot/dispatches \
            -d '{"event_type":"profile-update"}'
